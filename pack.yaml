ref: mattermost
label: "Mattermost"
description: "Mattermost messaging actions, thread workflows, file uploads, and live post events"
version: "0.1.0"
author: "Attune"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://github.com/attune-packs/mattermost"
  repository_url: "https://github.com/attune-packs/mattermost"
  source_version: "11.11"
  license: "Apache-2.0"

tags: [mattermost, chat, messaging, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
