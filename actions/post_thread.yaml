ref: mattermost.post_thread
label: "Post Mattermost Thread"
description: "Create a root post followed by up to 20 ordered replies"
enabled: true
workflow_file: workflows/post_thread.workflow.yaml
parameters:
  credential_key: {type: string, default: "pack.mattermost.credentials", key_ref: true, pattern: "^pack\\.mattermost\\.[a-z0-9][a-z0-9_-]{0,62}$"}
  channel_id: {type: string, required: true, pattern: "^[a-z0-9]{26}$"}
  message: {type: string, required: true, minLength: 1, maxLength: 16383}
  replies: {type: array, default: [], maxItems: 20, items: {type: string, minLength: 1, maxLength: 16383}}
output:
  root_post_id: {type: string}
  reply_count: {type: integer}
tags: [mattermost, posts, thread, workflow]
